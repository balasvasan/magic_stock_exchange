      <text x="80" y="22" font-size="9" font-weight="700" fill="#6366f1" letter-spacing="1.5" text-anchor="middle">COMPLIANCE GATE</text>
      <text x="80" y="42" font-size="11" fill="#e5e7eb" text-anchor="middle">DPDP §6(4) + §12</text>
      <text x="80" y="56" font-size="11" fill="#e5e7eb" text-anchor="middle">SEBI Master Circular</text>
    </g>
  </g>

