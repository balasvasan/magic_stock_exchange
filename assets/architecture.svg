      <g transform="translate(116, 0)"><rect width="86" height="22" rx="11" fill="#1e2535" stroke="#f96302" stroke-width="1"/><text x="43" y="15" text-anchor="middle">KAVACH · KYC</text></g>
      <g transform="translate(212, 0)"><rect width="100" height="22" rx="11" fill="#1e2535" stroke="#f96302" stroke-width="1"/><text x="50" y="15" text-anchor="middle">NIPATAN · trades</text></g>
      <g transform="translate(322, 0)"><rect width="106" height="22" rx="11" fill="#1e2535" stroke="#f96302" stroke-width="1"/><text x="53" y="15" text-anchor="middle">PRATEEK · symbols</text></g>
      <g transform="translate(438, 0)"><rect width="106" height="22" rx="11" fill="#1e2535" stroke="#f96302" stroke-width="1"/><text x="53" y="15" text-anchor="middle">SMRITI · alerts</text></g>
      <g transform="translate(554, 0)"><rect width="92" height="22" rx="11" fill="#1e2535" stroke="#6366f1" stroke-width="1"/><text x="46" y="15" text-anchor="middle">SEBI feed</text></g>
      <g transform="translate(656, 0)"><rect width="120" height="22" rx="11" fill="#1e2535" stroke="#6366f1" stroke-width="1"/><text x="60" y="15" text-anchor="middle">NSE/BSE BBO ticks</text></g>
      <g transform="translate(786, 0)"><rect width="92" height="22" rx="11" fill="#1e2535" stroke="#6366f1" stroke-width="1"/><text x="46" y="15" text-anchor="middle">News wire</text></g>
    </g>
    <text x="1060" y="124" font-size="11" fill="#6b7280" letter-spacing="1" text-anchor="end">CLOSES ARG-1</text>
  </g>

  <!-- vertical flow arrows: data flows UP from Ingest → Process → Serve, Govern is cross-cutting -->
  <defs>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f96302"/>
    </marker>
  </defs>
  <g stroke="#f96302" stroke-width="1.5" fill="none" opacity="0.65">
    <path d="M 600 590 L 600 570" marker-end="url(#arrowOrange)"/>
    <path d="M 600 430 L 600 410" marker-end="url(#arrowOrange)"/>
  </g>
  <!-- Govern is cross-cutting — dashed connector instead of a flow arrow -->
  <g stroke="#6366f1" stroke-width="1.5" fill="none" opacity="0.55" stroke-dasharray="4 3">
    <path d="M 600 270 L 600 250"/>
  </g>
</svg>
