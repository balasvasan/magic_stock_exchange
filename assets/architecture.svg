      <text x="14" y="22" font-size="11" font-weight="700" fill="#f96302" letter-spacing="1">CDW · APACHE IMPALA</text>
      <text x="14" y="42" font-size="12" fill="#e5e7eb">Governed views over Gold</text>
      <text x="14" y="60" font-size="11" fill="#9ca3af">Surveillance UI + BI</text>
    </g>
    <g transform="translate(285, 48)">
