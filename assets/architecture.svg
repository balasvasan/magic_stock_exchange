<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#161b27"/>
    </linearGradient>
    <linearGradient id="ingestGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f96302" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#f96302" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="processGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f96302" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f96302" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="serveGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f96302" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#f96302" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="governGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.10"/>
