  <line x1="60" y1="100" x2="280" y2="100" stroke="#f96302" stroke-width="2"/>

  <!-- Layer 4: Govern -->
  <g transform="translate(60, 130)">
    <rect width="1080" height="120" rx="8" fill="url(#governGrad)" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.5"/>
    <text x="20" y="32" font-size="11" font-weight="700" fill="#6366f1" letter-spacing="2">LAYER 4 — GOVERN  ·  SDX</text>
    <text x="20" y="58" font-size="14" fill="#e5e7eb" font-weight="600">Atlas classifications  ·  Ranger row + column policies  ·  DPDP audit log</text>
    <text x="20" y="80" font-size="13" fill="#9ca3af">Lineage capture across Bronze→Silver→Gold  ·  Time-travel erasure proofs  ·  Access audit trail</text>
    <text x="20" y="102" font-size="11" fill="#6b7280" letter-spacing="1">CLOSES ARG-5 (PART 2)</text>

