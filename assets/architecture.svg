      <text x="14" y="22" font-size="11" font-weight="700" fill="#f96302" letter-spacing="1">CAII · GENAI</text>
      <text x="14" y="42" font-size="12" fill="#e5e7eb">Llama 3.1 70B + Milvus</text>
      <text x="14" y="60" font-size="11" fill="#9ca3af">STR narrative drafter (RAG)</text>
    </g>
    <g transform="translate(815, 48)">
      <rect width="245" height="76" rx="6" fill="#1e2535" stroke="#374151" stroke-width="1"/>
      <text x="14" y="22" font-size="11" font-weight="700" fill="#f96302" letter-spacing="1">CDV · DASHBOARDS</text>
      <text x="14" y="42" font-size="12" fill="#e5e7eb">Surveillance ops KPIs</text>
      <text x="14" y="60" font-size="11" fill="#9ca3af">Backlog + FP rate + TTI</text>
    </g>
  </g>

  <!-- Layer 2: Process -->
