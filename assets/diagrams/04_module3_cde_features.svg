<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 740" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f1117"/><stop offset="100%" stop-color="#161b27"/></linearGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.6" fill="#f96302" fill-opacity="0.08"/></pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f96302"/></marker>
  </defs>
  <rect width="1400" height="740" fill="url(#bg)"/>
  <rect width="1400" height="740" fill="url(#dots)"/>

  <text x="60" y="48" font-size="22" font-weight="700" fill="#f96302" letter-spacing="3">MODULE 3 — TEMPORAL + CROSS-PRODUCT FEATURES + RULES</text>
  <text x="60" y="72" font-size="13" fill="#9ca3af" letter-spacing="1">DAY 5 · CLOSES ARG-2 (PART 2) · CP-07 / CP-08 / CP-09 (R-104 JANE STREET)</text>
  <line x1="60" y1="86" x2="280" y2="86" stroke="#f96302" stroke-width="2"/>

  <!-- Top: Feature engineering JOB-07 -->
  <g transform="translate(60, 130)">
    <text x="0" y="0" font-size="11" fill="#f96302" font-weight="700" letter-spacing="2">JOB-07 — FEATURE ENGINEERING (60 features in 6 groups)</text>
    <line x1="0" y1="10" x2="640" y2="10" stroke="#f96302" stroke-width="1" stroke-opacity="0.4"/>

    <!-- Inputs -->
    <g transform="translate(0, 25)">
      <rect width="220" height="120" rx="6" fill="#161b27" stroke="#9ca3af" stroke-width="1.5"/>
      <text x="12" y="22" font-size="11" fill="#9ca3af" font-weight="700">INPUTS (3)</text>
      <text x="12" y="44" font-size="10.5" fill="#e5e7eb">silver.order_events</text>
      <text x="12" y="62" font-size="10.5" fill="#e5e7eb">silver.executed_trades</text>
      <text x="12" y="80" font-size="10.5" fill="#e5e7eb">silver.instrument_master</text>
      <text x="12" y="100" font-size="10" fill="#6b7280">filtered to last 24h</text>
    </g>

    <line x1="220" y1="85" x2="280" y2="85" stroke="#f96302" stroke-width="1.5" marker-end="url(#ar)"/>

    <!-- Two output tables -->
    <g transform="translate(280, 25)">
      <rect width="320" height="55" rx="6" fill="#161b27" stroke="#f96302" stroke-width="2"/>
      <text x="12" y="22" font-size="11" fill="#f96302" font-weight="700">gold.member_temporal_features</text>
      <text x="12" y="40" font-size="10.5" fill="#e5e7eb">Per-member sequential metrics:</text>
      <text x="12" y="50" font-size="10" fill="#9ca3af">cancel rate · time-to-cancel · stack depth · order rate</text>
    </g>

    <g transform="translate(280, 90)">
      <rect width="320" height="55" rx="6" fill="#161b27" stroke="#f96302" stroke-width="2"/>
      <text x="12" y="22" font-size="11" fill="#f96302" font-weight="700">gold.cross_product_features</text>
      <text x="12" y="40" font-size="10.5" fill="#e5e7eb">Per-member × underlying:</text>
      <text x="12" y="50" font-size="10" fill="#9ca3af">cash vs futures vs options delta imbalance (Jane Street)</text>
    </g>
  </g>

  <!-- Middle: 5 rules firing -->
  <g transform="translate(60, 290)">
    <text x="0" y="0" font-size="11" fill="#f96302" font-weight="700" letter-spacing="2">JOB-08 — DETERMINISTIC RULES (5) → gold.alert_candidates</text>
    <line x1="0" y1="10" x2="640" y2="10" stroke="#f96302" stroke-width="1" stroke-opacity="0.4"/>

    <!-- 5 rule cards in a row -->
    <g font-size="10.5">
      <g transform="translate(0, 25)">
        <rect width="240" height="120" rx="6" fill="#161b27" stroke="#f96302" stroke-width="1.5"/>
        <text x="12" y="22" font-size="11" fill="#f96302" font-weight="700">R-101 SPOOFING</text>
        <text x="12" y="42" fill="#e5e7eb">Single large order</text>
        <text x="12" y="58" fill="#e5e7eb">Held &gt; 800ms then cancel</text>
        <text x="12" y="74" fill="#e5e7eb">Opposite-side fill in window</text>
        <text x="12" y="98" font-size="10" fill="#6366f1" font-weight="700">→ Case 0</text>
      </g>
      <g transform="translate(260, 25)">
        <rect width="240" height="120" rx="6" fill="#161b27" stroke="#f96302" stroke-width="1.5"/>
        <text x="12" y="22" font-size="11" fill="#f96302" font-weight="700">R-102 LAYERING</text>
        <text x="12" y="42" fill="#e5e7eb">≥3 stacked non-bona-fide</text>
        <text x="12" y="58" fill="#e5e7eb">Cancelled within 200ms of</text>
        <text x="12" y="74" fill="#e5e7eb">opposite-side fill</text>
        <text x="12" y="98" font-size="10" fill="#6366f1" font-weight="700">→ Cases 1, 3, 5, 9</text>
      </g>
      <g transform="translate(520, 25)">
        <rect width="240" height="120" rx="6" fill="#161b27" stroke="#f96302" stroke-width="1.5"/>
        <text x="12" y="22" font-size="11" fill="#f96302" font-weight="700">R-103 MOMENTUM IGN.</text>
        <text x="12" y="42" fill="#e5e7eb">Order rate &gt; 1000/sec</text>
        <text x="12" y="58" fill="#e5e7eb">Sustained &gt; 3 seconds</text>
        <text x="12" y="74" fill="#e5e7eb">Single instrument</text>
        <text x="12" y="98" font-size="10" fill="#6366f1" font-weight="700">→ Case 4</text>
      </g>
      <g transform="translate(780, 25)">
        <rect width="280" height="120" rx="6" fill="#1a1632" stroke="#6366f1" stroke-width="2"/>
        <text x="12" y="22" font-size="11" fill="#6366f1" font-weight="700" letter-spacing="1">R-104 CROSS-PRODUCT  ⚡</text>
        <text x="12" y="42" fill="#e5e7eb">delta_imbalance &gt; 7.0</text>
        <text x="12" y="58" fill="#e5e7eb">F&amp;O expiry day</text>
        <text x="12" y="74" fill="#e5e7eb">Jane Street pattern</text>
        <text x="12" y="98" font-size="10" fill="#6366f1" font-weight="700">→ Case 2 (CRITICAL)</text>
      </g>
      <g transform="translate(1080, 25)">
        <rect width="240" height="120" rx="6" fill="#161b27" stroke="#f96302" stroke-width="1.5"/>
        <text x="12" y="22" font-size="11" fill="#f96302" font-weight="700">R-105 WASH TRADE</text>
        <text x="12" y="42" fill="#e5e7eb">Same member firm</text>
        <text x="12" y="58" fill="#e5e7eb">Buy + sell crossing</text>
        <text x="12" y="74" fill="#e5e7eb">Same price within 1s</text>
        <text x="12" y="98" font-size="10" fill="#6366f1" font-weight="700">→ Case 5</text>
      </g>
    </g>
  </g>

  <!-- Bottom output -->
  <g transform="translate(60, 470)">
    <text x="0" y="0" font-size="11" fill="#f96302" font-weight="700" letter-spacing="2">OUTPUT — gold.alert_candidates (60-feature payload per alert)</text>
    <line x1="0" y1="10" x2="640" y2="10" stroke="#f96302" stroke-width="1" stroke-opacity="0.4"/>

    <g transform="translate(0, 25)">
      <rect width="800" height="80" rx="6" fill="#161b27" stroke="#f96302" stroke-width="2"/>
      <text x="14" y="22" font-size="11" fill="#f96302" font-weight="700">argus_${SID}_gold.alert_candidates</text>
      <text x="14" y="42" font-size="11" fill="#e5e7eb">Each row: rule_id · severity · pattern_type · member_firm_id · trader_id · instrument_code</text>
      <text x="14" y="60" font-size="11" fill="#e5e7eb">                  60-feature JSON payload · disposition='PENDING' · model_score=NULL</text>
      <text x="14" y="76" font-size="10" fill="#9ca3af">JOB-09 (Module 5) will score every PENDING alert every 5 min and write back model_score</text>
    </g>

    <g transform="translate(820, 25)">
      <rect width="500" height="80" rx="6" fill="#1a1632" stroke="#6366f1" stroke-width="1.5"/>
      <text x="14" y="20" font-size="10" fill="#6366f1" font-weight="700" letter-spacing="2">CHECKPOINT VERIFICATION</text>
      <text x="14" y="40" font-size="11" fill="#e5e7eb">CP-07: feature distributions match expected category pattern</text>
      <text x="14" y="56" font-size="11" fill="#e5e7eb">CP-08: all 10 manipulation cases (0-9) surface as candidates</text>
      <text x="14" y="72" font-size="11" fill="#e5e7eb">CP-09: Case 2 imbalance ≥ 7.0; R-104 fires CRITICAL</text>
    </g>
  </g>

  <!-- Why this matters -->
  <g transform="translate(60, 590)">
    <rect width="1280" height="100" rx="6" fill="#1e2535" stroke="#374151" stroke-width="1"/>
    <text x="20" y="28" font-size="11" fill="#f96302" font-weight="700" letter-spacing="2">WHY THIS CLOSES ARG-2 (PART 2)</text>
    <text x="20" y="52" font-size="11" fill="#e5e7eb">The legacy CEP engine couldn't compute features that span more than one product (cash + F&amp;O + options) on the same underlying — the literal pattern that defeated detection</text>
    <text x="20" y="70" font-size="11" fill="#e5e7eb">in Jane Street's 2024 SEBI case. Spark + Iceberg let JOB-07 join across all three product types in a single batch and compute the imbalance metric that R-104 fires on.</text>
    <text x="20" y="88" font-size="11" fill="#9ca3af">After Module 3 every planted manipulation case (0-9) is detected; Modules 5+ then prioritize to remove the noise.</text>
  </g>
</svg>
