      <text x="20" y="22" font-size="10" fill="#6366f1" font-weight="700" letter-spacing="2">⚡ THE TIME-TRAVEL PROOF LOOP — THIS IS WHAT CP-19 ACTUALLY VERIFIES</text>
      <text x="20" y="42" font-size="11" fill="#e5e7eb">SELECT ... FROM gold.alert_candidates  FOR SYSTEM_VERSION AS OF &lt;pre_snap&gt;  WHERE investor_pan_hash = &lt;hash&gt;  →  rows visible (proves data existed)</text>
      <text x="20" y="56" font-size="11" fill="#e5e7eb">SELECT ... FROM silver.member_master  FOR SYSTEM_VERSION AS OF &lt;post_snap&gt;  WHERE investor_pan_hash = &lt;hash&gt;  →  zero rows (proves erasure was actually applied)</text>
    </g>
  </g>

  <!-- CP-19 Pass criteria -->
