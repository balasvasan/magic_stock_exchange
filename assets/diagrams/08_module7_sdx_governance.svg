      <text x="12" y="22" font-size="11" fill="#9ca3af" font-weight="700">REQUEST IN</text>
      <text x="12" y="42" font-size="10.5" fill="#e5e7eb">Investor opts out of</text>
      <text x="12" y="58" font-size="10.5" fill="#e5e7eb">ANALYTICS, MARKETING</text>
      <text x="12" y="74" font-size="10" fill="#6b7280">via Consent Manager</text>
    </g>
    <line x1="240" y1="65" x2="280" y2="65" stroke="#f96302" stroke-width="1.5" marker-end="url(#ar)"/>

    <g transform="translate(280, 25)">
      <rect width="240" height="80" rx="6" fill="#161b27" stroke="#f96302" stroke-width="1.5"/>
      <text x="12" y="22" font-size="11" fill="#f96302" font-weight="700">UPDATE silver.member_master</text>
      <text x="12" y="42" font-size="10.5" fill="#e5e7eb">consent_status=WITHDRAWN</text>
      <text x="12" y="58" font-size="10.5" fill="#e5e7eb">consent_purpose=&lt;remaining&gt;</text>
