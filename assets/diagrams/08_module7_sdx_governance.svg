<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f1117"/><stop offset="100%" stop-color="#161b27"/></linearGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.6" fill="#f96302" fill-opacity="0.08"/></pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f96302"/></marker>
    <marker id="arInd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/></marker>
  </defs>
  <rect width="1400" height="880" fill="url(#bg)"/>
  <rect width="1400" height="880" fill="url(#dots)"/>

  <text x="60" y="48" font-size="22" font-weight="700" fill="#f96302" letter-spacing="3">MODULE 7 — SDX GOVERNANCE + DPDP COMPLIANCE</text>
  <text x="60" y="72" font-size="13" fill="#9ca3af" letter-spacing="1">DAY 9 · CLOSES ARG-5 · CP-17 / CP-18 / CP-19 ⚠ COMPLIANCE GATE</text>
  <line x1="60" y1="86" x2="280" y2="86" stroke="#f96302" stroke-width="2"/>

  <!-- ============== Three sub-flows arranged vertically ============== -->

  <!-- Sub-flow 1: Atlas classifications (CP-17) -->
  <g transform="translate(60, 130)">
    <text x="0" y="0" font-size="11" fill="#f96302" font-weight="700" letter-spacing="2">SUB-FLOW 1 — ATLAS CLASSIFICATIONS (apply_atlas_tags.py · CP-17)</text>
    <line x1="0" y1="10" x2="600" y2="10" stroke="#f96302" stroke-width="1" stroke-opacity="0.4"/>

    <g transform="translate(0, 25)">
      <rect width="240" height="80" rx="6" fill="#1e2535" stroke="#9ca3af" stroke-width="1.5"/>
      <text x="12" y="22" font-size="11" fill="#9ca3af" font-weight="700">JSON SOURCE OF TRUTH</text>
      <text x="12" y="42" font-size="10.5" fill="#e5e7eb">atlas_classifications.json</text>
      <text x="12" y="58" font-size="10.5" fill="#e5e7eb">6 tags × per-student copies</text>
      <text x="12" y="74" font-size="10" fill="#6b7280">Logical → physical at runtime</text>
    </g>
    <line x1="240" y1="65" x2="280" y2="65" stroke="#f96302" stroke-width="1.5" marker-end="url(#ar)"/>

    <g transform="translate(280, 25)">
      <rect width="240" height="80" rx="6" fill="#161b27" stroke="#f96302" stroke-width="1.5"/>
      <text x="12" y="22" font-size="11" fill="#f96302" font-weight="700">PHASE 1 — CREATE TYPES</text>
      <text x="12" y="42" font-size="10.5" fill="#e5e7eb">PII_HIGH_${SID}</text>
      <text x="12" y="58" font-size="10.5" fill="#e5e7eb">PII_LOW_${SID} · ...</text>
      <text x="12" y="74" font-size="10" fill="#6b7280">Idempotent — skips existing</text>
    </g>
    <line x1="520" y1="65" x2="560" y2="65" stroke="#f96302" stroke-width="1.5" marker-end="url(#ar)"/>

    <g transform="translate(560, 25)">
      <rect width="240" height="80" rx="6" fill="#161b27" stroke="#f96302" stroke-width="1.5"/>
      <text x="12" y="22" font-size="11" fill="#f96302" font-weight="700">PHASE 2 — APPLY TO COLS</text>
      <text x="12" y="42" font-size="10.5" fill="#e5e7eb">Walk applied_to lists</text>
      <text x="12" y="58" font-size="10.5" fill="#e5e7eb">~30 column attachments</text>
      <text x="12" y="74" font-size="10" fill="#6b7280">propagate=true (lineage)</text>
    </g>
    <line x1="800" y1="65" x2="840" y2="65" stroke="#f96302" stroke-width="1.5" marker-end="url(#ar)"/>

