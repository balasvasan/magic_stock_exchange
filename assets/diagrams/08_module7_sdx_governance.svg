      <text x="12" y="22" font-size="10" fill="#6366f1" font-weight="700">5. AUDIT ROW + SNAPSHOT_AFTER</text>
      <text x="12" y="42" font-size="10.5" fill="#e5e7eb">consent_audit row:</text>
      <text x="12" y="58" font-size="10.5" fill="#e5e7eb">event_type=ERASURE_COMPLETED</text>
      <text x="12" y="74" font-size="10.5" fill="#e5e7eb">pre_snap + post_snap recorded</text>
