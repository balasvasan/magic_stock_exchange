      <text x="12" y="42" font-size="10.5" fill="#e5e7eb">SEBI_AUDIT_TRAIL tables:</text>
      <text x="12" y="58" font-size="10.5" fill="#e5e7eb">alert_candidates kept</text>
      <text x="12" y="74" font-size="10.5" fill="#e5e7eb">(DPDP §7 exception)</text>
    </g>
    <line x1="940" y1="60" x2="980" y2="60" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arInd)"/>

