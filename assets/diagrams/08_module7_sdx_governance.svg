      <text x="12" y="22" font-size="10" fill="#6366f1" font-weight="700">3. DELETE PII</text>
      <text x="12" y="42" font-size="10.5" fill="#e5e7eb">silver.member_master</text>
      <text x="12" y="58" font-size="10.5" fill="#e5e7eb">bronze.member_cdc</text>
      <text x="12" y="74" font-size="10.5" fill="#e5e7eb">+ Milvus sweep</text>
    </g>
    <line x1="700" y1="60" x2="740" y2="60" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arInd)"/>

