      <text x="12" y="58" font-size="10.5" fill="#e5e7eb">capture current</text>
      <text x="12" y="74" font-size="10.5" fill="#e5e7eb">Iceberg snapshot_id</text>
    </g>
    <line x1="460" y1="60" x2="500" y2="60" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arInd)"/>

