      <text x="12" y="22" font-size="10" fill="#6366f1" font-weight="700" letter-spacing="2">✓ CP-17 VERIFICATION</text>
      <text x="12" y="42" font-size="10.5" fill="#e5e7eb">≥6 types registered</text>
      <text x="12" y="58" font-size="10.5" fill="#e5e7eb">≥30 column attachments</text>
      <text x="12" y="74" font-size="10" fill="#9ca3af">Atlas UI lineage view</text>
    </g>
