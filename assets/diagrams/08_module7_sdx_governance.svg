  <!-- Sub-flow 3: DPDP §12 erasure — THE COMPLIANCE GATE -->
  <g transform="translate(60, 410)">
    <text x="0" y="0" font-size="13" fill="#6366f1" font-weight="700" letter-spacing="3">⚠ SUB-FLOW 3 — DPDP §12 ERASURE (gdpr_erasure_workflow.py · CP-19 COMPLIANCE GATE)</text>
    <line x1="0" y1="10" x2="800" y2="10" stroke="#6366f1" stroke-width="2"/>
  </g>

  <!-- Erasure flow with prominent indigo styling -->
