      <text x="12" y="22" font-size="10" fill="#6366f1" font-weight="700">1. REQUEST IN</text>
      <text x="12" y="42" font-size="10.5" fill="#e5e7eb">DPO receives §12 request</text>
      <text x="12" y="58" font-size="10.5" fill="#e5e7eb">Identity verified upstream</text>
