    <rect width="1280" height="120" rx="6" fill="#1a1632" stroke="#6366f1" stroke-width="2"/>
    <text x="20" y="28" font-size="13" fill="#6366f1" font-weight="700" letter-spacing="3">⚠ CP-19 — THE COMPLIANCE GATE — NON-NEGOTIABLE PASS CONDITION</text>
    <text x="20" y="55" font-size="11" fill="#e5e7eb">Failing CP-19 fails the entire capstone, regardless of overall score.  This is intentional: a surveillance platform that can't prove DPDP §12 compliance is unlawful to operate.</text>
    <text x="20" y="78" font-size="11" fill="#e5e7eb">Required evidence: (a) at least one ERASURE_COMPLETED audit row with both pre_snap and post_snap snapshot IDs populated;</text>
    <text x="20" y="93" font-size="11" fill="#e5e7eb">(b) FOR SYSTEM_VERSION AS OF &lt;pre_snap&gt; query returns the erased rows; (c) FOR SYSTEM_VERSION AS OF &lt;post_snap&gt; same query returns zero rows;</text>
    <text x="20" y="108" font-size="11" fill="#e5e7eb">(d) statutory tables tagged SEBI_AUDIT_TRAIL_${SID} still contain rows after erasure (DPDP §7 retention proves working).</text>
  </g>

  <!-- Three CP markers -->
  <g transform="translate(60, 815)">
