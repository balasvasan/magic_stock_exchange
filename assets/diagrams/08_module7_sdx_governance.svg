      <circle cx="10" cy="6" r="9" fill="#1e2535" stroke="#f96302" stroke-width="1.5"/>
      <text x="10" y="10" font-size="9" font-family="ui-monospace" font-weight="700" fill="#f96302" text-anchor="middle">17</text>
      <text x="28" y="10" font-size="11" fill="#9ca3af">Atlas tags applied — ≥6 types, ≥30 column attachments visible in Atlas UI lineage</text>
    </g>
    <g transform="translate(420, 20)">
      <circle cx="10" cy="6" r="9" fill="#1e2535" stroke="#f96302" stroke-width="1.5"/>
      <text x="10" y="10" font-size="9" font-family="ui-monospace" font-weight="700" fill="#f96302" text-anchor="middle">18</text>
      <text x="28" y="10" font-size="11" fill="#9ca3af">Consent withdrawal — researcher view excludes investor; surveillance view still includes</text>
    </g>
    <g transform="translate(900, 20)">
      <circle cx="10" cy="6" r="13" fill="#6366f1" stroke="#6366f1" stroke-width="2"/>
      <text x="10" y="10" font-size="9" font-family="ui-monospace" font-weight="700" fill="#fff" text-anchor="middle">19</text>
      <text x="32" y="10" font-size="11" fill="#6366f1" font-weight="700">DPDP §12 ERASURE — pre/post Iceberg time-travel proof on ≥1 audit row</text>
    </g>
  </g>
</svg>
