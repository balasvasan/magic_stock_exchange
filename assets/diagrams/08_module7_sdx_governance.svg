      <text x="12" y="42" font-size="10.5" fill="#e5e7eb">gold.consent_audit</text>
      <text x="12" y="58" font-size="10.5" fill="#e5e7eb">event_type=CONSENT_WITHDRAWN</text>
      <text x="12" y="74" font-size="10" fill="#6b7280">+ Iceberg pre/post snapshots</text>
    </g>
    <line x1="800" y1="65" x2="840" y2="65" stroke="#f96302" stroke-width="1.5" marker-end="url(#ar)"/>

    <g transform="translate(840, 25)">
      <rect width="240" height="80" rx="6" fill="#1a1632" stroke="#6366f1" stroke-width="2"/>
      <text x="12" y="22" font-size="10" fill="#6366f1" font-weight="700" letter-spacing="2">✓ CP-18 VERIFICATION</text>
      <text x="12" y="42" font-size="10.5" fill="#e5e7eb">vw_research_aggregates</text>
      <text x="12" y="58" font-size="10.5" fill="#e5e7eb">no longer shows investor</text>
      <text x="12" y="74" font-size="10" fill="#9ca3af">Surveillance views still do</text>
